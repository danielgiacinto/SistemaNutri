name: Migraciones de base de datos

# Aplica las migraciones nuevas al proyecto de Supabase de producción cuando
# llegan a main. Si los secretos no están configurados, el flujo se omite.
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

concurrency:
  group: migraciones-produccion
  cancel-in-progress: false

jobs:
  aplicar:
    name: supabase db push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Verificar secretos
        id: verificar
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::notice::Faltan secretos de Supabase (ver docs/despliegue.md). Se omiten las migraciones."
            echo "configurado=false" >> "$GITHUB_OUTPUT"
          else
            echo "configurado=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.verificar.outputs.configurado == 'true'
        with:
          version: latest

      - name: Vincular proyecto
        if: steps.verificar.outputs.configurado == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Aplicar migraciones
        if: steps.verificar.outputs.configurado == 'true'
        run: supabase db push --yes
